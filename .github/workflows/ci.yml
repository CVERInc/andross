name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift toolchain
        run: swift --version

      # Release build + zero-dependency unit tests (Command Line Tools ship no
      # XCTest/Testing, so the suite is a plain executable runner). The
      # `integration` target is intentionally not run here: it boots a real
      # AVD and needs the Android SDK + an existing virtual device.
      - name: Build and unit test
        run: ./scripts/test.sh

      # Package the .app exactly as a release does and have the installed
      # binary check its own resources (--verify-resources). test.sh never
      # copies the SwiftPM resource bundle, so without this step a broken
      # bundle copy (no scrcpy-server in the .app) would still leave CI green.
      - name: Package app and verify its resources
        run: ./scripts/build-app.sh release "$RUNNER_TEMP/andross.app"
